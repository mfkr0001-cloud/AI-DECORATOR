name: Build Auto Decorator AI Android

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'resources/**'
      - 'CMakeLists.txt'
      - 'mod.json'
      - '.github/workflows/main.yml'

jobs:
  build:
    name: Build Android Geode mod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Android64 and Android32
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: latest
          targets: Android64,Android32
          build-config: Release

      - name: Upload Geode package(s)
        uses: actions/upload-artifact@v4
        with:
          name: AutoDecoratorAI-Android
          path: '**/*.geode'
          if-no-files-found: error
          retention-days: 14
