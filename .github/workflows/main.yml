
name: Auto Decorator AI Android Build

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android ARM64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Geode Android mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64
          build-config: Release
          path: .

      - name: Upload compiled GEODE file
        uses: actions/upload-artifact@v4
        with:
          name: AutoDecoratorAI-Android64
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
          retention-days: 30
